<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>능동형 공지·일정 알림 서비스</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1f36;
      --card2: #232a4a;
      --accent: #6c8cff;
      --accent2: #35d0a5;
      --text: #e7eaf5;
      --muted: #9aa3c7;
      --border: #2b3358;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1c2444 0%, var(--bg) 55%);
      color: #e7eaf5;
      min-height: 100vh;
    }
    header {
      padding: 28px 20px 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 14px; }
    .flow {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-top: 12px; color: var(--muted); font-size: 12px;
    }
    .flow span.step {
      background: var(--card); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 999px;
    }
    main { max-width: 900px; margin: 0 auto; padding: 12px 20px 60px; }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 20px;
    }
    .panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input, textarea, select {
      width: 100%; background: #11152a; color: #e7eaf5;
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-size: 14px; font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      margin-top: 14px; background: linear-gradient(135deg, var(--accent), #8a6cff);
      color: white; border: 0; border-radius: 10px; padding: 11px 18px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .feed-head { display: flex; justify-content: space-between; align-items: center; }
    .count { color: var(--muted); font-size: 13px; }
    .notice {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
      animation: pop .35s ease;
    }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    .notice .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .notice .title { font-weight: 700; font-size: 16px; }
    .badge {
      font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
      border: 1px solid var(--border);
    }
    .badge.notice { background: rgba(108,140,255,.15); color: #a9bcff; }
    .badge.schedule { background: rgba(53,208,165,.15); color: #6ee6c2; }
    .summary {
      margin-top: 10px; background: #11152a; border-left: 3px solid var(--accent2);
      padding: 10px 12px; border-radius: 8px; font-size: 13px; color: #cdd5f5;
      white-space: pre-wrap; line-height: 1.55;
    }
    .summary .lbl { color: var(--accent2); font-weight: 700; }
    .meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .meta a { color: var(--accent); }
    .bell { font-size: 12px; color: var(--accent2); }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--accent2); color: #06251c; font-weight: 700; padding: 12px 20px;
      border-radius: 12px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  </style>
</head>
<body>
  <header>
    <h1>🔔 능동형 공지·일정 알림 서비스</h1>
    <div class="sub">새 공지/일정이 등록되면 AI가 먼저 요약해서 알림을 보내드립니다.</div>
    <div class="flow">
      <span class="step">1. 공지 등록</span> →
      <span class="step">2. AI 요약</span> →
      <span class="step">3. 능동 알림</span>
    </div>
  </header>

  <main>
    <div class="panel">
      <h2>새 공지 등록 (POST /notices)</h2>
      <form id="form">
        <label>제목</label>
        <input id="title" placeholder="예: 2026학년도 2학기 수강신청 안내" required />
        <div class="row">
          <div>
            <label>유형</label>
            <select id="type">
              <option value="notice">공지 (notice)</option>
              <option value="schedule">일정 (schedule)</option>
            </select>
          </div>
          <div>
            <label>링크 (선택)</label>
            <input id="url" placeholder="https://..." />
          </div>
        </div>
        <label>내용</label>
        <textarea id="content" placeholder="공지 내용을 입력하세요. 날짜/시간이 들어가면 요약에 자동으로 잡힙니다."></textarea>
        <button type="submit" id="submitBtn">등록하고 AI 알림 받기</button>
      </form>
    </div>

    <div class="panel">
      <div class="feed-head">
        <h2>📥 알림 피드 (GET /notices)</h2>
        <span class="count" id="count">-</span>
      </div>
      <div id="feed"><div class="empty">불러오는 중...</div></div>
    </div>
  </main>

  <div class="toast" id="toast">🔔 새 알림 도착!</div>

  <script>
    const feed = document.getElementById('feed');
    const countEl = document.getElementById('count');

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function fmtSummary(s) {
      // "핵심요약:" / "중요정보:" 라벨을 강조
      return esc(s)
        .replace(/(핵심요약:|중요정보:|일정 시작:)/g, '<span class="lbl">$1</span>');
    }

    function render(list) {
      countEl.textContent = list.length + '건';
      if (!list.length) {
        feed.innerHTML = '<div class="empty">아직 등록된 공지가 없어요. 위에서 하나 등록해보세요.</div>';
        return;
      }
      feed.innerHTML = list.map((n) => `
        <div class="notice">
          <div class="top">
            <div class="title">${esc(n.title)}</div>
            <span class="badge ${n.type === 'schedule' ? 'schedule' : 'notice'}">
              ${n.type === 'schedule' ? '일정' : '공지'}
            </span>
          </div>
          ${n.summary ? `<div class="summary">${fmtSummary(n.summary)}</div>` : ''}
          <div class="meta">
            <span class="bell">${n.notified ? '✅ 알림 발송됨' : '⏳ 대기'}</span>
            <span>🕒 ${new Date(n.createdAt).toLocaleString('ko-KR')}</span>
            ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noreferrer">🔗 원문</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function load() {
      try {
        const res = await fetch('/notices');
        const list = await res.json();
        render(list);
      } catch (e) {
        feed.innerHTML = '<div class="empty">불러오기 실패: ' + esc(e.message) + '</div>';
      }
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'AI가 요약 중...';
      const body = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        type: document.getElementById('type').value,
        url: document.getElementById('url').value || undefined,
      };
      try {
        const res = await fetch('/notices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          toast('🔔 새 알림 도착: ' + (data.notice?.title || '등록됨'));
          document.getElementById('form').reset();
          await load();
        } else {
          toast('⚠️ ' + (data.error || '등록 실패'));
        }
      } catch (err) {
        toast('⚠️ ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = '등록하고 AI 알림 받기';
      }
    });

    load();
    setInterval(load, 5000); // 폴러가 새 공지를 감지하면 자동 반영
  </script>
</body>
</html>
